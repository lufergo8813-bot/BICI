<head>

<title>Uso de bicicletas · Feri Stays</title>
<link rel="icon" id="fav" href="data:,">
<style>
:root{--navy:#1F2D47;--gold:#DDA52E;--goldd:#8A6410;--goldl:#FBF2D9;--bg:#F6F7F9;--line:#DDE1E8;--mute:#5E6A80;--bad:#C0392B;--ok:#2E9E6B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--navy);font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:17px;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:0 16px 48px}
.hero{background:var(--navy);color:#fff;text-align:center;padding:calc(22px + env(safe-area-inset-top)) 20px 26px;border-bottom:5px solid var(--gold);border-radius:0 0 28px 28px}
.logo{width:116px;height:116px;border-radius:50%;box-shadow:0 0 0 4px rgba(221,165,46,.4);display:block;margin:0 auto 14px}
.hero h1{margin:0;font-size:28px;line-height:1.15;letter-spacing:-.3px}
.hero p{margin:6px 0 0;color:#C9D1E2}
.lang{display:inline-flex;margin-top:16px;background:#2C3D5E;border-radius:99px;padding:4px}
.lang button{border:0;background:none;color:#DDE3F0;font:inherit;font-weight:700;font-size:14px;padding:7px 16px;border-radius:99px;cursor:pointer}
.lang button.on{background:var(--gold);color:var(--navy)}
.lead{font-size:18px;margin:22px 0 8px}
h2{font-size:19px;margin:0 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:14px 0}
.card ul{margin:0;padding-left:20px}.card li{margin:7px 0}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;counter-reset:q}
.q{background:var(--goldl);border:1px solid #EBD9A0;border-radius:16px;padding:14px 14px 14px 52px;position:relative;counter-increment:q}
.q::before{content:counter(q);position:absolute;left:14px;top:14px;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.q b{display:block;font-size:16px;margin-bottom:2px}.q span{font-size:15px;color:#3B4660;line-height:1.4}
@media(max-width:520px){.quick{grid-template-columns:1fr}}
details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:14px 0}
summary{font-weight:700;cursor:pointer}details ul{margin:10px 0 2px;padding-left:20px;font-size:15px;color:#3B4660}
.formcard{border:2px solid var(--navy)}
label{display:block;font-weight:700;font-size:15px;margin:14px 0 5px}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;font:inherit;padding:13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--navy)}
textarea{min-height:84px}
input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.bad{border-color:var(--bad)!important}
.chk{display:flex;gap:12px;align-items:flex-start;margin:12px 0;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-weight:500;font-size:16px;cursor:pointer}
.chk input{width:24px;height:24px;flex:none;margin:1px 0 0;accent-color:var(--navy)}
.chk.bad{background:#FDECEA}
.sigwrap{border:2px dashed #9AA5BC;border-radius:14px;background:#fff;position:relative}
#sig{display:block;width:100%;height:190px;touch-action:none;border-radius:12px}
.sigwrap.bad{border-color:var(--bad)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font:inherit;font-weight:800;font-size:18px;background:var(--navy);color:#fff;margin:14px 0 4px;cursor:pointer;text-align:center}
.btn:active{background:#121c30}.btn.sec{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:8px 0 0;background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.err{color:var(--bad);font-weight:700;margin:10px 0 0}
.mute{color:var(--mute);font-size:15px}
.done{text-align:center}.done .tick{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:36px;margin:6px auto 10px}
.lockmsg{display:flex;gap:12px;align-items:center;text-align:left;background:var(--goldl);border:2px solid var(--gold);border-radius:16px;padding:14px 16px;margin:16px 0 6px}
.lockic{flex:none;width:46px;height:46px;border-radius:50%;background:var(--navy);display:grid;place-items:center;font-size:22px}
.lockmsg b{display:block;font-size:17px;margin-bottom:2px}.lockmsg span{font-size:15px;color:#3B4660;line-height:1.4}
footer{text-align:center;color:var(--mute);font-size:14px;margin-top:26px}
[hidden]{display:none!important}
</style>
</head>

 sec:[
 {h:'1. Reglas de uso',l:['Te entregamos la bicicleta y un casco, sin costo. Revisa la bicicleta antes de salir: frenos, llantas, timbre y luces. Si algo no funciona, no la uses y avísanos.','Usa siempre el casco bien ajustado (regla de la casa para todos los usuarios).','Cumple el Código Nacional de Tránsito: circula por la derecha, respeta semáforos y señales, cede el paso a los peatones y no uses los andenes.','No uses el celular ni audífonos mientras pedaleas, no te sujetes de otros vehículos y no lleves pasajeros.','No montes bajo los efectos del alcohol, drogas o medicamentos que afecten tu atención.','De noche o con poca luz usa luces y algo reflectivo; si no los tienes, no salgas.','No uses la bicicleta con lluvia fuerte ni por vías o terrenos peligrosos.','Solo la usa la persona que firma (y los menores a su cargo). No la prestes a otras personas.','Cuando la dejes, asegúrala siempre con el candado. Al terminar tu estadía, devuélvela en el lugar indicado.','No modifiques ni repares la bicicleta. Si hay un accidente o daño, avísanos de inmediato. En una emergencia llama al 123.']},
 {h:'2. Riesgos y descargo de responsabilidad',l:['Andar en bicicleta tiene riesgos: caídas, golpes, choques con vehículos o personas y lesiones, que pueden ser graves.','Declaras que recibes la bicicleta y el casco en buen estado aparente (frenos, llantas, luces), que estás en condiciones físicas de usarla y que sabes montar. Aceptas usarla bajo tu propia responsabilidad.','Feri Stays te entrega una bicicleta revisada y en buen estado. Responde por lo que la ley le exige, por ejemplo un defecto o una falla de mantenimiento que no te informó. Este documento no te pide renunciar a derechos que la ley colombiana no permite renunciar.','En la medida que la ley lo permita, Feri Stays no se hace responsable de lesiones o daños causados por no cumplir estas reglas o las normas de tránsito, por imprudencia o por hechos de terceros.','Eres responsable por los daños que causes a otras personas o bienes mientras uses la bicicleta.','Salvo que te digamos lo contrario por escrito, la bicicleta no incluye seguro de accidentes para ti. Te recomendamos tener seguro de viaje o de salud.']},
 {h:'3. Daños, pérdida o robo',l:['El uso de la bicicleta y del casco es gratuito, pero los daños y perjuicios que ocurran mientras los uses corren por tu cuenta: si se dañan, o se pierden o te los roban por descuido (por ejemplo, al dejarlos sin candado), pagarás el costo real de reparación o reposición.','Te mostraremos la cotización o factura que lo respalde. El desgaste normal y las fallas que ya tuviera la bicicleta no se cobran.']},
 {h:'4. Menores de edad',l:['Los menores pueden usar la bicicleta solo con un adulto responsable (padre, madre, tutor o persona autorizada por ellos) que firme este documento.','El adulto decide si el menor tiene la edad y la habilidad para montar, lo supervisa todo el tiempo y se asegura de que use casco.','El adulto responde por el menor y acepta este documento en su nombre.']},
 {h:'5. Tus datos personales (Ley 1581 de 2012)',l:['Responsable del tratamiento: Feri Stays. Contacto: '+CFG.email+'.','Usamos tus datos (incluida tu firma) solo para guardar esta constancia, atender reclamaciones y por seguridad. No los vendemos.','Tienes derecho a conocer, actualizar, corregir y pedir que eliminemos tus datos, y a revocar esta autorización, escribiendo al correo de contacto, salvo que debamos conservarlos por un deber legal.','Los datos de los menores se tratan solo con autorización del adulto responsable y para esta finalidad. Darlos es opcional.']},
 {h:'6. Firma electrónica',l:['Al firmar con el dedo o el mouse aceptas este documento. La firma electrónica puede tener la misma validez legal que la manuscrita en Colombia (Ley 527 de 1999 y Decreto 2364 de 2012). Recibirás una constancia en PDF.']}],

 sec:[
 {h:'1. Rules of use',l:['We provide the bike and a helmet at no charge. Check the bike before riding: brakes, tires, bell and lights. If something does not work, do not ride it and let us know.','Always wear a properly fitted helmet (house rule for every rider).','Follow the Colombian Traffic Code: ride on the right, obey traffic lights and signs, yield to pedestrians and stay off sidewalks.','Do not use your phone or headphones while riding, do not hold on to other vehicles and do not carry passengers.','Do not ride under the influence of alcohol, drugs or medication that affects your attention.','At night or in low light, use lights and something reflective; if you do not have them, do not ride.','Do not ride in heavy rain or on dangerous roads or terrain.','Only the person who signs (and the minors in their care) may use the bike. Do not lend it to others.','Whenever you leave it, lock it. When your stay ends, return it to the place we indicate.','Do not modify or repair the bike. If there is an accident or damage, tell us right away. In an emergency, call 123.']},
 {h:'2. Risks and liability waiver',l:['Cycling carries risks: falls, bumps, collisions with vehicles or people, and injuries, which can be serious.','You declare that you receive the bike and helmet in good apparent condition (brakes, tires, lights), that you are physically able to ride and that you know how to ride a bike. You agree to use it at your own responsibility.','Feri Stays provides a checked bike in good condition. It remains responsible for what the law requires, for example a defect or maintenance failure it did not tell you about. This document does not ask you to give up rights that Colombian law does not allow you to waive.','To the extent the law permits, Feri Stays is not responsible for injuries or damage caused by not following these rules or traffic regulations, by recklessness, or by the acts of third parties.','You are responsible for any damage you cause to other people or property while using the bike.','Unless we tell you otherwise in writing, the bike does not include accident insurance for you. We recommend having travel or health insurance.']},
 {h:'3. Damage, loss or theft',l:['Use of the bike and helmet is free, but any damage or loss that occurs while you use them is at your expense: if they are damaged, or are lost or stolen because of carelessness (for example, left unlocked), you will pay the actual cost of repair or replacement.','We will show you the quote or invoice that supports it. Normal wear and tear and faults the bike already had are not charged.']},
 {h:'4. Minors',l:['Minors may ride only with a responsible adult (parent, guardian or person authorized by them) who signs this document.','The adult decides whether the minor is old enough and able to ride, supervises at all times and makes sure a helmet is worn.','The adult is responsible for the minor and accepts this document on the minor’s behalf.']},
 {h:'5. Your personal data (Law 1581 of 2012)',l:['Data controller: Feri Stays. Contact: '+CFG.email+'.','We use your data (including your signature) only to keep this record, handle claims and for safety. We do not sell it.','You have the right to know, update, correct and request deletion of your data, and to withdraw this authorization, by writing to the contact email, unless we must keep it because of a legal duty.','Minors’ data is processed only with the responsible adult’s authorization and for this purpose. Providing it is optional.']},
 {h:'6. Electronic signature',l:['By signing with your finger or mouse you accept this document. An electronic signature can have the same legal validity as a handwritten one in Colombia (Law 527 of 1999 and Decree 2364 of 2012). You will receive a PDF record.']}],

 sec:[
 {h:'1. Règles d’utilisation',l:['Nous mettons à votre disposition le vélo et un casque, sans frais. Vérifiez le vélo avant de partir : freins, pneus, sonnette et éclairage. Si quelque chose ne fonctionne pas, ne l’utilisez pas et prévenez-nous.','Portez toujours un casque bien ajusté (règle de la maison pour tous).','Respectez le code de la route colombien : roulez à droite, respectez les feux et les panneaux, cédez le passage aux piétons et n’utilisez pas les trottoirs.','N’utilisez pas le téléphone ni d’écouteurs en roulant, ne vous accrochez pas à d’autres véhicules et ne transportez pas de passager.','Ne roulez pas sous l’effet de l’alcool, de drogues ou de médicaments qui altèrent votre attention.','La nuit ou par faible luminosité, utilisez des feux et un élément réfléchissant ; sinon, ne roulez pas.','Ne roulez pas sous une forte pluie ni sur des routes ou terrains dangereux.','Seule la personne qui signe (et les mineurs sous sa garde) peut utiliser le vélo. Ne le prêtez à personne.','Quand vous le laissez, attachez-le toujours avec l’antivol. À la fin du séjour, rendez-le à l’endroit indiqué.','Ne modifiez ni ne réparez le vélo. En cas d’accident ou de dommage, prévenez-nous immédiatement. En cas d’urgence, appelez le 123.']},
 {h:'2. Risques et décharge de responsabilité',l:['Le vélo comporte des risques : chutes, chocs, collisions avec des véhicules ou des personnes, et blessures, parfois graves.','Vous déclarez recevoir le vélo et le casque en bon état apparent (freins, pneus, éclairage), être en bonne condition physique pour rouler et savoir faire du vélo. Vous l’utilisez sous votre propre responsabilité.','Feri Stays met à disposition un vélo vérifié et en bon état. Elle reste responsable de ce que la loi exige, par exemple un défaut ou un défaut d’entretien dont elle ne vous aurait pas informé. Ce document ne vous demande pas de renoncer à des droits auxquels la loi colombienne ne permet pas de renoncer.','Dans la mesure permise par la loi, Feri Stays n’est pas responsable des blessures ou dommages causés par le non-respect de ces règles ou du code de la route, par imprudence ou par le fait de tiers.','Vous êtes responsable des dommages que vous causez à d’autres personnes ou à des biens pendant l’utilisation du vélo.','Sauf indication écrite contraire, le vélo n’inclut pas d’assurance accident pour vous. Nous vous recommandons d’avoir une assurance voyage ou santé.']},
 {h:'3. Dommages, perte ou vol',l:['L’utilisation du vélo et du casque est gratuite, mais les dommages ou pertes survenant pendant leur utilisation sont à votre charge : s’ils sont endommagés, ou perdus ou volés par négligence (par exemple laissés sans antivol), vous paierez le coût réel de la réparation ou du remplacement.','Nous vous présenterons le devis ou la facture correspondant. L’usure normale et les défauts préexistants ne sont pas facturés.']},
 {h:'4. Mineurs',l:['Les mineurs peuvent utiliser le vélo uniquement avec un adulte responsable (parent, tuteur ou personne autorisée par eux) qui signe ce document.','L’adulte décide si le mineur a l’âge et les capacités pour rouler, le surveille en permanence et veille au port du casque.','L’adulte est responsable du mineur et accepte ce document en son nom.']},
 {h:'5. Vos données personnelles (loi 1581 de 2012)',l:['Responsable du traitement : Feri Stays. Contact : '+CFG.email+'.','Nous utilisons vos données (y compris votre signature) uniquement pour conserver ce justificatif, traiter les réclamations et pour la sécurité. Nous ne les vendons pas.','Vous avez le droit de connaître, mettre à jour, rectifier et demander la suppression de vos données, et de retirer cette autorisation, en écrivant à l’adresse de contact, sauf si nous devons les conserver en vertu d’une obligation légale.','Les données des mineurs ne sont traitées qu’avec l’autorisation de l’adulte responsable et pour cette finalité. Les fournir est facultatif.']},

let lang='es';

function setLang(l){
  lang=l;try{localStorage.setItem('lang',l)}catch(e){}
  document.documentElement.lang=l;const U=T[l].ui;
  document.querySelectorAll('[data-i18n]').forEach(el=>{if(U[el.dataset.i18n]!==undefined)el.textContent=U[el.dataset.i18n]});
  document.querySelectorAll('[data-ph]').forEach(el=>{el.placeholder=U[el.dataset.ph]});
  $('#quick').innerHTML=T[l].quick.map(([h,p])=>`<div class="q"><b>${esc(h)}</b><span>${esc(p)}</span></div>`).join('');
  $('#doc').innerHTML=T[l].sec.map(s=>`<section class="card"><h2>${esc(s.h)}</h2><ul>${s.l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`).join('');
  $('#legalList').innerHTML=T[l].legal.map(x=>`<li>${esc(x)}</li>`).join('');
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  document.title=U.title+' · Feri Stays';
  if(!$('#err').hidden)$('#err').hidden=true;
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));

/* ============ FIRMA ============ */
const cv=$('#sig'),cx=cv.getContext('2d');let drawing=false,inked=false,last=null;
function initCanvas(){
  const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
  cv.width=Math.max(300,Math.round(r.width*d));cv.height=Math.round(190*d);
  cx.setTransform(d,0,0,d,0,0);cx.lineWidth=2.6;cx.lineCap='round';cx.lineJoin='round';cx.strokeStyle='#1F2D47';inked=false;
}
const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}drawing=true;last=pos(e);cx.beginPath();cx.arc(last.x,last.y,1.2,0,6.3);cx.fillStyle='#1F2D47';cx.fill();inked=true;$('#sigwrap').classList.remove('bad')});
cv.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=pos(e);cx.beginPath();cx.moveTo(last.x,last.y);cx.lineTo(p.x,p.y);cx.stroke();last=p});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>{drawing=false}));
$('#clear').addEventListener('click',()=>{initCanvas()});

/* ============ FORMULARIO ============ */
$('#hasMinors').addEventListener('change',e=>{$('#minorsBox').hidden=!e.target.checked});
document.querySelectorAll('#f input,#f textarea,#f select').forEach(el=>el.addEventListener('input',()=>{el.classList.remove('bad');const c=el.closest('.chk');if(c)c.classList.remove('bad')}));
function mark(id,bad){const el=$('#'+id);if(!el)return;const t=el.type==='checkbox'?el.closest('.chk'):el;t.classList.toggle('bad',bad)}
function validate(){
  const U=T[lang].ui,v=id=>$('#'+id).value.trim();let bad=false,emailBad=false;
  ['name','docNum'].forEach(id=>{const b=v(id).length<2;mark(id,b);bad=bad||b});
  const eb=!/^\S+@\S+\.\S+$/.test(v('email'));mark('email',eb);if(eb){bad=true;emailBad=v('email').length>0}
  if(bad)return emailBad&&v('name').length>1&&v('docNum').length>1?U.errEmail:U.errFields;
  const mi=$('#hasMinors').checked;
  if(mi){const b1=v('minorsInfo').length<3,b2=!$('#c5').checked;mark('minorsInfo',b1);mark('c5',b2);if(b1||b2)return U.errMinors}
  let all=true;['c6','c7','c1','c2','c3','c4'].forEach(id=>{const b=!$('#'+id).checked;mark(id,b);if(b)all=false});
  if(!all)return U.errChecks;
  if(!inked){$('#sigwrap').classList.add('bad');return U.errSign}
  return '';
}

/* ============ PDF (sin librerías) ============ */
const latin=s=>String(s).replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/•/g,'-').replace(/œ/g,'oe').replace(/Œ/g,'OE').replace(/[\u00a0\u202f\u2009]/g,' ').replace(/[^\x00-\xff]/g,'?');
const pdfEsc=s=>s.replace(/([\\()])/g,'\\$1');
function makePDF(items,sigB64,sigW,sigH){
  const W=595,H=842,M=50,maxW=W-2*M,pages=[[]];let y=H-72;
  const cw=(fs,b)=>fs*(b?0.57:0.53);
  const wrap=(text,fs,b,ind)=>{const mc=Math.floor((maxW-ind)/cw(fs,b));const out=[];let cur='';
    text.split(/\s+/).forEach(w=>{if(!w)return;if((cur+' '+w).trim().length>mc){if(cur)out.push(cur);cur=w}else cur=(cur+' '+w).trim()});
    if(cur)out.push(cur);return out.length?out:['']};
  const cur=()=>pages[pages.length-1],np=()=>{pages.push([]);y=H-72};
  items.forEach(it=>{
    if(it.sig){const dw=220,dh=dw*sigH/sigW;if(y-dh-20<55)np();y-=dh;cur().push({img:1,x:M,y,w:dw,h:dh});y-=14;return}
    const fs=it.s||10,ind=it.bullet?12:0;y-=(it.g||0);
    wrap(latin(it.t),fs,it.b,ind).forEach((ln,i)=>{if(y-fs*1.45<55)np();y-=fs*1.45;
      if(it.bullet&&i===0)cur().push({x:M,y,t:'-',fs,b:0,c:it.c});
      cur().push({x:M+ind,y,t:ln,fs,b:it.b,c:it.c})});
  });
  const n=pages.length,pl=T[lang].pdf.page;
  const streams=pages.map((p,i)=>{
    let s='0.12 0.18 0.28 rg 0 '+(H-10)+' '+W+' 10 re f\n0.87 0.65 0.18 rg 0 '+(H-13)+' '+W+' 3 re f\n';
    p.forEach(o=>{
      if(o.img){s+='q '+o.w.toFixed(1)+' 0 0 '+o.h.toFixed(1)+' '+o.x+' '+o.y.toFixed(1)+' cm /Im1 Do Q\n';return}
      const c=o.c||[0.1,0.1,0.15];
      s+='BT /'+(o.b?'F2':'F1')+' '+o.fs+' Tf '+c.join(' ')+' rg '+o.x+' '+o.y.toFixed(1)+' Td ('+pdfEsc(o.t)+') Tj ET\n';
    });
    s+='BT /F1 8 Tf 0.4 0.43 0.5 rg '+M+' 28 Td (Feri Stays  |  '+pdfEsc(latin(pl))+' '+(i+1)+'/'+n+') Tj ET\n';
    return s;
  });
  const bin=atob(sigB64);let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const offs=[];
  const add=(id,body)=>{offs[id]=out.length;out+=id+' 0 obj\n'+body+'\nendobj\n'};
  const kids=pages.map((_,i)=>(7+2*i)+' 0 R').join(' ');
  add(1,'<< /Type /Catalog /Pages 2 0 R >>');
  add(2,'<< /Type /Pages /Kids ['+kids+'] /Count '+n+' >>');
  add(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  add(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  add(5,'<< /Type /XObject /Subtype /Image /Width '+sigW+' /Height '+sigH+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+bin.length+' >>\nstream\n'+bin+'\nendstream');
  streams.forEach((s,i)=>{
    add(6+2*i,'<< /Length '+s.length+' >>\nstream\n'+s+'endstream');
    add(7+2*i,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << /Im1 5 0 R >> >> /Contents '+(6+2*i)+' 0 R >>');
  });
  const N=6+2*n-1,xo=out.length;let x='xref\n0 '+(N+1)+'\n0000000000 65535 f \n';
  for(let i=1;i<=N;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  out+=x+'trailer\n<< /Size '+(N+1)+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF';
  return out;
}
const NAVY=[0.12,0.18,0.28],GOLDD=[0.54,0.39,0.06];
function docText(){return T[lang].sec.map(s=>s.h+'\n'+s.l.join('\n')).join('\n')}
function buildItems(d,hash){
  const t=T[lang],U=t.ui,P=t.pdf,L=[];
  L.push({t:P.title,s:17,b:1,c:NAVY});
  L.push({t:'Feri Stays',s:11,b:1,c:GOLDD,g:2});
  L.push({t:P.date+': '+d.when+'  ('+d.iso+')',s:9.5,g:6});
  L.push({t:P.lang+': '+LNAME[lang],s:9.5});
  L.push({t:P.signer,s:12,b:1,c:NAVY,g:14});
  [[U.name,d.name],[U.docType,d.docTypeLabel],[U.docNum,d.docNum],[U.email,d.email],[U.phone,d.phone||P.none],[U.stay,d.stay||P.none],[U.emerg,d.emerg||P.none]].forEach(([k,v])=>L.push({t:k+': '+v,s:10}));
  if(d.minors)L.push({t:P.minorsLbl+': '+d.minorsInfo,s:10});
  L.push({t:P.accepted,s:12,b:1,c:NAVY,g:14});
  const ids=['c6','c7','c1','c2','c3','c4'].concat(d.minors?['c5']:[]);
  ids.forEach(id=>L.push({t:'[X] '+U[id],s:10,bullet:0}));
  L.push({t:P.docH,s:12,b:1,c:NAVY,g:16});
  t.sec.forEach(s=>{L.push({t:s.h,s:10.5,b:1,c:NAVY,g:9});s.l.forEach(x=>L.push({t:x,s:9.5,bullet:1}))});
  L.push({t:P.sigH,s:12,b:1,c:NAVY,g:18});
  L.push({sig:1});
  L.push({t:d.name+'  -  '+d.docTypeLabel+' '+d.docNum,s:10,b:1});
  L.push({t:P.hash+':',s:8.5,g:8,c:[0.4,0.43,0.5]});
  L.push({t:hash||'n/a',s:8,c:[0.4,0.43,0.5]});
  return L;
}
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return ''}}

/* ============ ENVÍO ============ */
let last_pdf=null;
const toBytes=s=>{const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
function download(){const b=new Blob([last_pdf.bytes],{type:'application/pdf'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=last_pdf.name;document.body.appendChild(a);a.click();a.remove()}
async function sharePDF(){
  const P=T[lang].pdf,file=new File([last_pdf.bytes],last_pdf.name,{type:'application/pdf'});
  const to=CFG.recipients.join(', ');try{if(navigator.clipboard)navigator.clipboard.writeText(to).catch(()=>{})}catch(_){}
  const text='To: '+to+'\n'+P.mailBody;
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:P.mail,text});
    else download();
  }catch(e){if(e.name!=='AbortError')download()}
}
function setStatus(k,showShare){const p=$('#doneP');p.dataset.i18n=k;p.textContent=T[lang].ui[k];$('#share').hidden=!showShare;$('#retry').hidden=true}
async function sendAuto(){
  setStatus('sendingP',false);
  try{
    await fetch(CFG.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(last_pdf.payload)});
    setStatus('sentP',false);
  }catch(e){setStatus('failP',true);$('#retry').hidden=false}
}
$('#share').addEventListener('click',sharePDF);$('#download').addEventListener('click',download);$('#retry').addEventListener('click',sendAuto);
/* Cerrar: los navegadores solo permiten window.close() en pestañas abiertas por script;
   si no se cierra (p. ej. abierta desde el QR), se limpia el formulario y se vuelve al inicio. */
$('#closeBtn').addEventListener('click',()=>{
  try{window.close()}catch(_){}
  setTimeout(()=>{
    $('#f').reset();$('#minorsBox').hidden=true;initCanvas();$('#submit').disabled=false;last_pdf=null;
    $('#done').hidden=true;$('#content').hidden=false;$('#closeHint').hidden=false;
    document.querySelectorAll('.bad').forEach(el=>el.classList.remove('bad'));scrollTo(0,0);
  },250);
});

$('#f').addEventListener('submit',async e=>{
  e.preventDefault();const eb=$('#err'),msg=validate();
  if(msg){eb.textContent=msg;eb.hidden=false;eb.scrollIntoView({block:'center',behavior:'smooth'});return}
  eb.hidden=true;$('#submit').disabled=true;$('#closeHint').hidden=true;
  const v=id=>$('#'+id).value.trim(),now=new Date(),U=T[lang].ui;
  const d={name:v('name'),docType:$('#docType').value,docTypeLabel:U[$('#docType').value],docNum:v('docNum'),email:v('email'),phone:v('phone'),stay:v('stay'),emerg:v('emerg'),
    minors:$('#hasMinors').checked,minorsInfo:v('minorsInfo'),lang,iso:now.toISOString(),when:now.toLocaleString(LOC[lang],{dateStyle:'long',timeStyle:'short'})};
  const t2=document.createElement('canvas');t2.width=cv.width;t2.height=cv.height;const c2=t2.getContext('2d');
  c2.fillStyle='#fff';c2.fillRect(0,0,t2.width,t2.height);c2.drawImage(cv,0,0);
  const url=t2.toDataURL('image/jpeg',0.92),b64=url.split(',')[1];
  const hash=await sha(JSON.stringify(d)+docText()+b64);
  const str=makePDF(buildItems(d,hash),b64,t2.width,t2.height);
  const safe=d.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'firmante';
  const fname='consentimiento-bicicletas-'+safe+'-'+d.iso.slice(0,10)+'.pdf';
  last_pdf={bytes:toBytes(str),name:fname,data:d,payload:{...d,hash,fileName:fname,recipients:CFG.recipients,pdfBase64:btoa(str)}};
  $('#content').hidden=true;$('#done').hidden=false;scrollTo(0,0);
  if(CFG.endpoint)sendAuto();else setStatus('manualP',true);
});

$('#fav').href=document.querySelector('.logo').src;
setLang(lang);initCanvas();
</script>
